<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini & DeepSeek Korean Studio</title>
  <style>
    :root {
      --bg-main: #131314;
      --bg-surface: #1e1f20;
      --bg-hover: #2d2e30;
      --text-main: #e3e3e3;
      --text-sub: #9aa0a6;
      --border: #333537;
      --gemini-bg: #1a237e;
      --gemini-border: #5c6bc0;
      --deepseek-bg: #143d22;
      --deepseek-border: #4caf50;
      --accent: #8ab4f8;
    }
    body.light-mode {
      --bg-main: #ffffff;
      --bg-surface: #f0f4f9;
      --bg-hover: #e1e5ea;
      --text-main: #1f1f1f;
      --text-sub: #5f6368;
      --border: #dadce0;
      --gemini-bg: #e8eaf6;
      --gemini-border: #3f51b5;
      --deepseek-bg: #e8f5e9;
      --deepseek-border: #2e7d32;
      --accent: #1a73e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      height: 56px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg-main);
      z-index: 10;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--bg-hover); }
    .center-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-btn {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pill-btn.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    .pill-btn.paused { background: #ef6c00; color: #fff; border-color: #ff9800; }

    /* Status Bar */
    .status-bar {
      font-size: 12px;
      color: var(--text-sub);
      padding: 4px 12px;
      text-align: center;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
    }

    /* Chat Area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-sub);
      max-width: 300px;
    }
    .empty-state h2 { color: var(--accent); margin-bottom: 8px; font-size: 20px; }
    .msg {
      padding: 12px 14px;
      border-radius: 16px;
      max-width: 88%;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 15px;
    }
    .gemini {
      background: var(--gemini-bg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border-left: 3px solid var(--gemini-border);
    }
    .deepseek {
      background: var(--deepseek-bg);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      border-right: 3px solid var(--deepseek-border);
    }
    .user {
      background: var(--bg-surface);
      align-self: center;
      border: 1px solid var(--border);
      font-size: 14px;
      max-width: 92%;
    }
    .msg-header {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .action-btns { display: flex; gap: 6px; }
    .small-btn {
      background: rgba(128,128,128,0.2);
      color: var(--text-main);
      border: none;
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }
    .chat-img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 8px;
      display: block;
    }

    /* Bottom Input Bar */
    .bottom-wrap {
      background: var(--bg-main);
      padding: 8px 12px 14px;
      border-top: 1px solid var(--border);
    }
    #img-preview-box {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      background: var(--bg-surface);
      padding: 6px 10px;
      border-radius: 10px;
      width: fit-content;
    }
    #img-preview-box img { height: 44px; border-radius: 6px; }
    .input-bar {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border-radius: 26px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      gap: 6px;
    }
    .input-bar input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 6px;
      font-size: 15px;
      outline: none;
    }
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Side Drawer Menu */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      z-index: 50;
    }
    .drawer {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100%;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      z-index: 60;
      transition: left 0.25s ease;
      display: flex;
      flex-direction: column;
      padding: 14px;
    }
    .drawer.open { left: 0; }
    .drawer-section-title {
      font-size: 12px;
      color: var(--text-sub);
      margin: 14px 0 8px;
      font-weight: 600;
    }
    .menu-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-btn:hover { background: var(--bg-hover); }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-main);
    }
    .history-item:hover, .history-item.active { background: var(--bg-hover); }
    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .del-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 2px 6px;
    }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal h3 { font-size: 17px; margin-bottom: 4px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-sub); }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>

<!-- Top App Bar -->
<div class="topbar">
  <button class="icon-btn" onclick="toggleDrawer(true)" title="Menu">☰</button>
  
  <div class="center-controls">
    <button class="pill-btn" id="play-pause-btn" onclick="toggleRun()">▶️ စတင်မည်</button>
  </div>

  <button class="icon-btn" onclick="createNewChat()" title="New Chat">✏️</button>
</div>

<div class="status-bar" id="status-text">အသင့်ဖြစ်ပါပြီ (ခေါင်းစဉ် သို့မဟုတ် ပုံတင်ပြီး စတင်ပါ)</div>

<!-- Chat Container -->
<div id="chat-box">
  <div class="empty-state" id="empty-state">
    <h2>🇰🇷 Korean AI Studio</h2>
    <p>Gemini နှင့် DeepSeek တို့ ကိုရီးယား-မြန်မာ တွဲဖက် ဆွေးနွေးပေးပါမည်။ ခေါင်းစဉ်ရိုက်ထည့်ပါ သို့မဟုတ် ပုံတင်ပါ။</p>
  </div>
</div>

<!-- Bottom Input Bar -->
<div class="bottom-wrap">
  <div id="img-preview-box">
    <img id="img-preview" src="" alt="Preview">
    <span style="font-size:12px;">ပုံရွေးထားပါသည်</span>
    <button class="small-btn" onclick="clearSelectedImage()">✕</button>
  </div>
  <div class="input-bar">
    <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
    <button class="icon-btn" style="width:36px;height:36px;font-size:18px;" onclick="document.getElementById('image-input').click()" title="ပုံတင်ရန်">🖼️</button>
    <input type="text" id="topic-input" placeholder="ဆွေးနွေးချင်တဲ့ ခေါင်းစဉ်ရေးပါ..." onkeypress="if(event.key==='Enter') sendUserMessage()">
    <button class="send-btn" onclick="sendUserMessage()">➤</button>
  </div>
</div>

<!-- Left Drawer Menu -->
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
<div class="drawer" id="drawer">
  <button class="pill-btn" style="justify-content:center; margin-bottom:8px;" onclick="createNewChat(); toggleDrawer(false);">✏️ New Chat အသစ်စမည်</button>

  <div class="drawer-section-title">လုပ်ဆောင်ချက်များ</div>
  <button class="menu-btn" onclick="copyAll(); toggleDrawer(false);">📋 လက်ရှိ Chat အကုန် Copy</button>
  <button class="menu-btn" onclick="downloadChat(); toggleDrawer(false);">💾 Save as (.txt)</button>
  <button class="menu-btn" onclick="toggleTheme()">🌓 Dark / Light Mode ပြောင်းရန်</button>
  <button class="menu-btn" onclick="openSettings(); toggleDrawer(false);">⚙️ AI Settings (ချိန်ညှိရန်)</button>

  <div class="drawer-section-title">သိမ်းထားသော Chat များ</div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h3>⚙️ AI နှစ်ခု ချိန်ညှိခြင်း (Settings)</h3>
    
    <div class="form-group">
      <label>Gemini API Key</label>
      <input type="password" id="set-g-key" placeholder="AIzaSy...">
    </div>
    <div class="form-group">
      <label>Gemini Model ရွေးချယ်ရန်</label>
      <select id="set-g-model">
        <option value="gemini-2.0-flash">gemini-2.0-flash (မြန်ဆန် & ပုံဖတ်နိုင်)</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash (နောက်ဆုံးထွက်)</option>
        <option value="gemini-1.5-flash">gemini-1.5-flash (တည်ငြိမ်)</option>
      </select>
    </div>

    <div class="form-group">
      <label>OpenRouter API Key</label>
      <input type="password" id="set-o-key" placeholder="sk-or-v1-...">
    </div>
    <div class="form-group">
      <label>OpenRouter Model (DeepSeek / အခြား)</label>
      <input type="text" id="set-o-model" value="deepseek/deepseek-chat">
    </div>

    <div class="form-group">
      <label>Gemini အခန်းကဏ္ဍ (Role / Prompt)</label>
      <textarea id="set-g-role">You are a friendly Korean teacher. Introduce natural Korean sentences, explain vocabulary/grammar briefly, and discuss the topic/image.</textarea>
    </div>

    <div class="form-group">
      <label>DeepSeek အခန်းကဏ္ဍ (Role / Prompt)</label>
      <textarea id="set-d-role">You are a Korean conversation partner. Reply naturally to Gemini, give alternative expressions or real-life examples in Korea.</textarea>
    </div>

    <div class="form-group">
      <label>တစ်ယောက်ပြောပြီး စောင့်ဆိုင်းချိန် (စက္ကန့်) & အသံနှုန်း</label>
      <div style="display:flex; gap:8px;">
        <input type="number" id="set-delay" value="4" min="1" max="30" style="flex:1;" title="Delay Seconds">
        <input type="number" id="set-tts-rate" value="0.9" step="0.1" min="0.5" max="1.5" style="flex:1;" title="TTS Speed">
      </div>
    </div>

    <div class="modal-actions">
      <button class="pill-btn" onclick="closeSettings()">ပိတ်မည်</button>
      <button class="pill-btn active" onclick="saveSettings()">သိမ်းဆည်းမည်</button>
    </div>
  </div>
</div>

<script>
  // State Variables
  let isRunning = false;
  let turn = 'gemini';
  let sessions = JSON.parse(localStorage.getItem('kr_ai_sessions') || '[]');
  let currentSessionId = null;
  let pendingImageBase64 = null;
  let pendingImageMime = null;

  // Default Config
  let config = Object.assign({
    gKey: localStorage.getItem('g_key') || '',
    oKey: localStorage.getItem('o_key') || '',
    gModel: 'gemini-2.0-flash',
    oModel: 'deepseek/deepseek-chat',
    gRole: 'You are a friendly Korean teacher. Introduce natural Korean sentences, explain vocabulary/grammar briefly, and discuss the topic/image.',
    dRole: 'You are a Korean conversation partner. Reply naturally to Gemini, give alternative expressions or real-life examples in Korea.',
    delay: 4,
    ttsRate: 0.9,
    theme: 'dark'
  }, JSON.parse(localStorage.getItem('kr_ai_config') || '{}'));

  window.onload = () => {
    if (config.theme === 'light') document.body.classList.add('light-mode');
    if (sessions.length > 0) {
      loadSession(sessions[0].id);
    } else {
      createNewChat(false);
    }
    renderHistoryList();
  };

  function saveAllSessions() {
    localStorage.setItem('kr_ai_sessions', JSON.stringify(sessions));
    renderHistoryList();
  }

  function getCurrentSession() {
    return sessions.find(s => s.id === currentSessionId);
  }

  function createNewChat(render = true) {
    pauseConversation();
    const newId = 'chat_' + Date.now();
    sessions.unshift({
      id: newId,
      title: 'စကားဝိုင်းအသစ်',
      messages: []
    });
    currentSessionId = newId;
    saveAllSessions();
    if (render) loadSession(newId);
  }

  function loadSession(id) {
    pauseConversation();
    currentSessionId = id;
    const session = getCurrentSession();
    const box = document.getElementById('chat-box');
    box.innerHTML = '';

    if (!session || session.messages.length === 0) {
      box.innerHTML = `
        <div class="empty-state" id="empty-state">
          <h2>🇰🇷 Korean AI Studio</h2>
          <p>Gemini နှင့် DeepSeek တို့ ကိုရီးယား-မြန်မာ တွဲဖက် ဆွေးနွေးပေးပါမည်။ ခေါင်းစဉ်ရိုက်ထည့်ပါ သို့မဟုတ် ပုံတင်ပါ။</p>
        </div>`;
      turn = 'gemini';
    } else {
      session.messages.forEach(m => renderMessage(m.role, m.name, m.text, m.image));
      const last = session.messages[session.messages.length - 1];
      turn = (last.role === 'gemini') ? 'deepseek' : 'gemini';
    }
    renderHistoryList();
    updateStatus('အသင့်ဖြစ်ပါပြီ');
  }

  function deleteSession(id, e) {
    e.stopPropagation();
    if (!confirm('ဒီ Chat မှတ်တမ်းကို ဖျက်မှာ သေချာပါသလား?')) return;
    sessions = sessions.filter(s => s.id !== id);
    if (sessions.length === 0) {
      createNewChat(true);
    } else {
      saveAllSessions();
      if (currentSessionId === id) loadSession(sessions[0].id);
    }
  }

  function renderHistoryList() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    sessions.forEach(s => {
      const item = document.createElement('div');
      item.className = 'history-item' + (s.id === currentSessionId ? ' active' : '');
      item.onclick = () => { loadSession(s.id); toggleDrawer(false); };
      
      const title = document.createElement('span');
      title.className = 'history-title';
      title.innerText = '💬 ' + s.title;

      const del = document.createElement('button');
      del.className = 'del-chat-btn';
      del.innerText = '🗑️';
      del.onclick = (e) => deleteSession(s.id, e);

      item.appendChild(title);
      item.appendChild(del);
      list.appendChild(item);
    });
  }

  // Image Handling
  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      pendingImageMime = file.type;
      pendingImageBase64 = dataUrl.split(',')[1];
      document.getElementById('img-preview').src = dataUrl;
      document.getElementById('img-preview-box').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function clearSelectedImage() {
    pendingImageBase64 = null;
    pendingImageMime = null;
    document.getElementById('image-input').value = '';
    document.getElementById('img-preview-box').style.display = 'none';
  }

  // Sending User Message / Image
  function sendUserMessage() {
    const input = document.getElementById('topic-input');
    const text = input.value.trim();
    if (!text && !pendingImageBase64) return;

    const displayText = text || 'ဒီပုံထဲက အကြောင်းအရာကို ကိုရီးယားလို ဆွေးနွေးပေးပါ။';
    const imgDataUrl = pendingImageBase64 ? `data:${pendingImageMime};base64,${pendingImageBase64}` : null;

    const session = getCurrentSession();
    if (session.messages.length === 0) {
      session.title = displayText.slice(0, 26);
    }

    addMessage('user', 'You', displayText, imgDataUrl, pendingImageBase64, pendingImageMime);
    
    input.value = '';
    clearSelectedImage();
    turn = 'gemini'; // User ပို့ပြီးတာနဲ့ Gemini က အရင်စဖြေမယ် (ပုံပါရင် Gemini Vision ဖတ်နိုင်အောင်)
    if (!isRunning) startConversation();
  }

  function addMessage(role, name, text, image = null, rawBase64 = null, mimeType = null) {
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    renderMessage(role, name, text, image);
    const session = getCurrentSession();
    session.messages.push({ role, name, text, image, rawBase64, mimeType });
    saveAllSessions();
  }

  function renderMessage(role, name, text, image = null) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const header = document.createElement('div');
    header.className = 'msg-header';
    header.innerHTML = `<span><b>${name}</b></span>`;

    if (role !== 'user') {
      const btnGroup = document.createElement('div');
      btnGroup.className = 'action-btns';

      const ttsBtn = document.createElement('button');
      ttsBtn.className = 'small-btn';
      ttsBtn.innerText = '🔊 နားထောင်';
      ttsBtn.onclick = () => speakKorean(text, ttsBtn);
      btnGroup.appendChild(ttsBtn);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'small-btn';
      copyBtn.innerText = '📋 Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.innerText = '✅';
        setTimeout(() => copyBtn.innerText = '📋 Copy', 1200);
      };
      btnGroup.appendChild(copyBtn);
      header.appendChild(btnGroup);
    }

    const content = document.createElement('div');
    content.innerText = text;

    div.appendChild(header);
    div.appendChild(content);

    if (image) {
      const imgEl = document.createElement('img');
      imgEl.src = image;
      imgEl.className = 'chat-img';
      div.appendChild(imgEl);
    }

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // TTS
  function speakKorean(fullText, btnElement) {
    window.speechSynthesis.cancel();
    const koreanOnly = fullText.replace(/\([^)]*\)/g, '').trim();
    if (!koreanOnly) return;

    const utterance = new SpeechSynthesisUtterance(koreanOnly);
    utterance.lang = 'ko-KR';
    utterance.rate = parseFloat(config.ttsRate) || 0.9;

    btnElement.innerText = '🔊 ...';
    utterance.onend = () => { btnElement.innerText = '🔊 နားထောင်'; };
    utterance.onerror = () => { btnElement.innerText = '🔊 နားထောင်'; };
    window.speechSynthesis.speak(utterance);
  }

  // Controls
  function toggleRun() {
    if (isRunning) pauseConversation();
    else startConversation();
  }

  function pauseConversation() {
    isRunning = false;
    window.speechSynthesis.cancel();
    const btn = document.getElementById('play-pause-btn');
    btn.innerText = '▶️ ဆက်ပြောမည်';
    btn.className = 'pill-btn paused';
    updateStatus('⏸️ ခဏရပ်ထားပါသည်');
  }

  async function startConversation() {
    if (!config.gKey || !config.oKey) {
      alert('Menu (☰) > AI Settings ထဲမှာ Gemini နဲ့ OpenRouter API Key အရင်ထည့်ပေးပါ။');
      openSettings();
      return;
    }
    if (isRunning) return;
    isRunning = true;

    const btn = document.getElementById('play-pause-btn');
    btn.innerText = '⏸️ ခဏရပ်မည်';
    btn.className = 'pill-btn active';

    const session = getCurrentSession();
    if (session.messages.length === 0) {
      addMessage('user', 'System', 'နေ့စဉ်သုံး ကိုရီးယားစကားပြော အကြောင်း စတင်ဆွေးနွေးပါ။');
    }

    while (isRunning) {
      const recentMsgs = session.messages.slice(-6);
      const contextText = recentMsgs.map(m => `${m.name}: ${m.text}`).join('\n');
      
      // နောက်ဆုံး User Message မှာ ပုံပါမပါ စစ်ဆေးခြင်း
      const lastUserWithImg = [...recentMsgs].reverse().find(m => m.role === 'user' && m.rawBase64);

      if (turn === 'gemini') {
        updateStatus(`💬 Gemini (${config.gModel}) စာရိုက်နေသည်...`);
        const reply = await callGemini(contextText, lastUserWithImg);
        if (!isRunning) break;
        if (reply) addMessage('gemini', 'Gemini', reply);
        turn = 'deepseek';
      } else {
        updateStatus('💬 DeepSeek စာရိုက်နေသည်...');
        const reply = await callOpenRouter(contextText);
        if (!isRunning) break;
        if (reply) addMessage('deepseek', 'DeepSeek', reply);
        turn = 'gemini';
      }

      if (!isRunning) break;
      const waitSec = parseInt(config.delay) || 4;
      updateStatus(`⏳ ${waitSec} စက္ကန့် စောင့်ဆိုင်းနေပါသည်...`);
      await new Promise(r => setTimeout(r, waitSec * 1000));
    }
  }

  async function callGemini(context, imgMsg) {
    const baseRule = `${config.gRole}\nIMPORTANT FORMAT RULE: Speak 2-3 natural Korean sentences. Immediately below the Korean sentences, provide the accurate Burmese (Myanmar) translation inside parentheses ( ).`;
    
    const parts = [{ text: `${baseRule}\n\nConversation:\n${context}\n\nYour turn (Gemini):` }];
    if (imgMsg && imgMsg.rawBase64) {
      parts.push({
        inline_data: {
          mime_type: imgMsg.mimeType,
          data: imgMsg.rawBase64
        }
      });
    }

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${config.gModel}:generateContent?key=${config.gKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts }] })
      });
      const data = await res.json();
      if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
        return data.candidates[0].content.parts[0].text;
      }
      const errMsg = data.error ? data.error.message : 'Unknown Gemini Error';
      pauseConversation();
      return `Gemini Error: ${errMsg}`;
    } catch (e) {
      pauseConversation();
      return `Gemini Network Error: ${e.message}`;
    }
  }

  async function callOpenRouter(context) {
    const baseRule = `${config.dRole}\nIMPORTANT FORMAT RULE: Speak 2-3 natural Korean sentences. Immediately below the Korean sentences, provide the accurate Burmese (Myanmar) translation inside parentheses ( ).`;
    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${config.oKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: config.oModel,
          messages: [
            { role: "system", content: baseRule },
            { role: "user", content: `Conversation:\n${context}\n\nYour turn (DeepSeek):` }
          ]
        })
      });
      const data = await res.json();
      if (data.choices?.[0]?.message?.content) {
        return data.choices[0].message.content;
      }
      const errMsg = data.error ? data.error.message : 'Unknown OpenRouter Error';
      pauseConversation();
      return `OpenRouter Error: ${errMsg}`;
    } catch (e) {
      pauseConversation();
      return `OpenRouter Error: ${e.message}`;
    }
  }

  // Drawer, Theme & Settings Functions
  function toggleDrawer(open) {
    document.getElementById('drawer').classList.toggle('open', open);
    document.getElementById('drawer-overlay').style.display = open ? 'block' : 'none';
  }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    config.theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    localStorage.setItem('kr_ai_config', JSON.stringify(config));
  }

  function openSettings() {
    document.getElementById('set-g-key').value = config.gKey;
    document.getElementById('set-g-model').value = config.gModel;
    document.getElementById('set-o-key').value = config.oKey;
    document.getElementById('set-o-model').value = config.oModel;
    document.getElementById('set-g-role').value = config.gRole;
    document.getElementById('set-d-role').value = config.dRole;
    document.getElementById('set-delay').value = config.delay;
    document.getElementById('set-tts-rate').value = config.ttsRate;
    document.getElementById('settings-modal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settings-modal').style.display = 'none';
  }

  function saveSettings() {
    config.gKey = document.getElementById('set-g-key').value.trim();
    config.gModel = document.getElementById('set-g-model').value;
    config.oKey = document.getElementById('set-o-key').value.trim();
    config.oModel = document.getElementById('set-o-model').value.trim() || 'deepseek/deepseek-chat';
    config.gRole = document.getElementById('set-g-role').value.trim();
    config.dRole = document.getElementById('set-d-role').value.trim();
    config.delay = document.getElementById('set-delay').value;
    config.ttsRate = document.getElementById('set-tts-rate').value;

    localStorage.setItem('kr_ai_config', JSON.stringify(config));
    closeSettings();
    updateStatus('✅ Settings များကို သိမ်းဆည်းပြီးပါပြီ');
  }

  function copyAll() {
    const session = getCurrentSession();
    if (!session || session.messages.length === 0) return;
    const text = session.messages.map(m => `[${m.name}]\n${m.text}`).join('\n\n---\n\n');
    navigator.clipboard.writeText(text);
    updateStatus('📋 Chat တစ်ခုလုံးကို Copy ကူးပြီးပါပြီ');
  }

  function downloadChat() {
    const session = getCurrentSession();
    if (!session || session.messages.length === 0) return;
    const text = session.messages.map(m => `[${m.name}]\n${m.text}`).join('\n\n----------------------------------------\n\n');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${session.title}.txt`;
    a.click();
  }

  function updateStatus(msg) {
    document.getElementById('status-text').innerText = msg;
  }
</script>
</body>
