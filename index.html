<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini & DeepSeek Korean Tutor (Auto-Save)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #1e1e1e; padding: 12px; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
    .keys { display: flex; gap: 8px; flex-wrap: wrap; }
    input { background: #2c2c2c; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; flex: 1; min-width: 140px; font-size: 14px; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    button { padding: 8px 11px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-start { background: #4caf50; color: white; }
    .btn-pause { background: #ff9800; color: black; }
    .btn-copy-all { background: #2196f3; color: white; }
    .btn-save { background: #9c27b0; color: white; }
    .btn-clear { background: #d32f2f; color: white; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px; border-radius: 10px; max-width: 88%; line-height: 1.6; position: relative; white-space: pre-wrap; font-size: 15px; }
    .gemini { background: #1a237e; align-self: flex-start; border-left: 4px solid #448aff; }
    .deepseek { background: #1b5e20; align-self: flex-end; border-right: 4px solid #69f0ae; }
    .user { background: #333; align-self: center; border: 1px solid #555; font-size: 13px; }
    .msg-header { font-size: 12px; opacity: 0.9; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .action-btns { display: flex; gap: 6px; }
    .small-btn { background: rgba(255,255,255,0.18); color: #fff; padding: 4px 8px; font-size: 11px; border-radius: 4px; }
    .small-btn:active { background: rgba(255,255,255,0.35); }
    .footer { background: #1e1e1e; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #333; }
    .status-bar { font-size: 12px; color: #aaa; padding: 4px 12px; background: #181818; text-align: center; }
  </style>
</head>
<body>

<div class="header">
  <div class="keys">
    <input type="password" id="gemini-key" placeholder="Gemini API Key ထည့်ပါ" onchange="saveKeys()">
    <input type="password" id="openrouter-key" placeholder="OpenRouter API Key ထည့်ပါ" onchange="saveKeys()">
  </div>
  <div class="controls">
    <button class="btn-start" onclick="startConversation()">▶️ စတင် / ဆက်ပြော</button>
    <button class="btn-pause" onclick="pauseConversation()">⏸️ ခဏရပ်</button>
    <button class="btn-copy-all" onclick="copyAll()">📋 Copy</button>
    <button class="btn-save" onclick="downloadChat()">💾 Save (.txt)</button>
    <button class="btn-clear" onclick="clearChat()">🗑️ ရှင်းမည်</button>
  </div>
</div>

<div class="status-bar" id="status-text">အသင့်ဖြစ်ပါပြီ</div>

<div id="chat-box"></div>

<div class="footer">
  <input type="text" id="topic-input" placeholder="ဆွေးနွေးချင်တဲ့ ခေါင်းစဉ် (ဥပမာ- စားသောက်ဆိုင်မှာ မှာစားခြင်း)">
  <button class="btn-start" onclick="sendUserTopic()">ပို့မည်</button>
</div>

<script>
  let isRunning = false;
  let turn = 'gemini';
  let chatHistory = [];

  // App စဖွင့်ချိန်တွင် API Keys နှင့် သိမ်းထားသော Chat များကို ပြန်ခေါ်ခြင်း
  window.onload = () => {
    document.getElementById('gemini-key').value = localStorage.getItem('g_key') || '';
    document.getElementById('openrouter-key').value = localStorage.getItem('o_key') || '';

    const savedChat = localStorage.getItem('korean_chat_history');
    if (savedChat) {
      try {
        chatHistory = JSON.parse(savedChat);
        chatHistory.forEach(m => renderMessage(m.role, m.name, m.text));
        if (chatHistory.length > 0) {
          // နောက်ဆုံးပြောခဲ့သူပေါ်မူတည်ပြီး အလှည့်ပြန်သတ်မှတ်မယ်
          const lastRole = chatHistory[chatHistory.length - 1].role;
          turn = (lastRole === 'gemini') ? 'deepseek' : 'gemini';
          updateStatus(`💾 သိမ်းထားသော စကားပြော ${chatHistory.length} ကြောင်းကို ပြန်ဖော်ထားပါသည်`);
        }
      } catch (e) {
        console.error("Failed to load chat history", e);
      }
    }
  };

  function saveKeys() {
    localStorage.setItem('g_key', document.getElementById('gemini-key').value.trim());
    localStorage.setItem('o_key', document.getElementById('openrouter-key').value.trim());
  }

  function saveChatToStorage() {
    localStorage.setItem('korean_chat_history', JSON.stringify(chatHistory));
  }

  const systemPrompt = `You are having a friendly conversation with another AI to teach Korean speaking to a Burmese learner. 
  Rules:
  1. Speak naturally in Korean (2-3 sentences max per turn).
  2. Immediately below the Korean text, provide the accurate Burmese (Myanmar) translation inside parentheses ( ).
  3. Keep the conversation engaging, practical, and focused on daily Korean speaking.`;

  function speakKorean(fullText, btnElement) {
    window.speechSynthesis.cancel();
    const koreanOnly = fullText.replace(/\([^)]*\)/g, '').trim();
    if (!koreanOnly) return;

    const utterance = new SpeechSynthesisUtterance(koreanOnly);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.9;

    btnElement.innerText = '🔊 ဖတ်နေသည်...';
    utterance.onend = () => { btnElement.innerText = '🔊 နားထောင်'; };
    utterance.onerror = () => { btnElement.innerText = '🔊 နားထောင်'; };

    window.speechSynthesis.speak(utterance);
  }

  // UI ပေါ်တွင် စာသားပြသပေးမည့် Function
  function renderMessage(sender, name, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    
    const header = document.createElement('div');
    header.className = 'msg-header';
    header.innerHTML = `<span><b>${name}</b></span>`;
    
    if (sender !== 'user') {
      const btnGroup = document.createElement('div');
      btnGroup.className = 'action-btns';

      const ttsBtn = document.createElement('button');
      ttsBtn.className = 'small-btn';
      ttsBtn.innerText = '🔊 နားထောင်';
      ttsBtn.onclick = () => speakKorean(text, ttsBtn);
      btnGroup.appendChild(ttsBtn);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'small-btn';
      copyBtn.innerText = '📋 Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.innerText = '✅ Copied';
        setTimeout(() => copyBtn.innerText = '📋 Copy', 1500);
      };
      btnGroup.appendChild(copyBtn);

      header.appendChild(btnGroup);
    }

    const content = document.createElement('div');
    content.innerText = text;

    div.appendChild(header);
    div.appendChild(content);
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // စာသားအသစ်ထည့်ပြီး Auto-Save လုပ်မည့် Function
  function addMessage(sender, name, text) {
    renderMessage(sender, name, text);
    chatHistory.push({ role: sender, name: name, text: text });
    saveChatToStorage();
  }

  function updateStatus(msg) {
    document.getElementById('status-text').innerText = msg;
  }

  function sendUserTopic() {
    const input = document.getElementById('topic-input');
    const topic = input.value.trim();
    if (!topic) return;
    addMessage('user', 'You (ခေါင်းစဉ်)', topic);
    input.value = '';
    if (!isRunning) startConversation();
  }

  function pauseConversation() {
    isRunning = false;
    window.speechSynthesis.cancel();
    updateStatus("⏸️ စကားပြောခြင်းကို ခဏရပ်ထားပါသည်။ (Chat များကို သိမ်းဆည်းပြီးပါပြီ)");
  }

  function clearChat() {
    if (!confirm("သိမ်းထားတဲ့ Chat တွေအားလုံးကို ဖျက်ပစ်မှာ သေချာပါသလား?")) return;
    pauseConversation();
    chatHistory = [];
    localStorage.removeItem('korean_chat_history');
    document.getElementById('chat-box').innerHTML = '';
    updateStatus("🗑️ Chat အားလုံးကို ရှင်းလင်းပြီးပါပြီ။");
  }

  function copyAll() {
    if (chatHistory.length === 0) return;
    const allText = chatHistory.map(m => `[${m.name}]\n${m.text}`).join('\n\n---\n\n');
    navigator.clipboard.writeText(allText);
    updateStatus("📋 Chat တစ်ခုလုံးကို Copy ကူးပြီးပါပြီ!");
  }

  // Chat များကို .txt ဖိုင်အဖြစ် ဒေါင်းလုဒ်ဆွဲသိမ်းဆည်းခြင်း
  function downloadChat() {
    if (chatHistory.length === 0) {
      alert("သိမ်းစရာ စကားပြောမှတ်တမ်း မရှိသေးပါ။");
      return;
    }
    const allText = chatHistory.map(m => `[${m.name}]\n${m.text}`).join('\n\n----------------------------------------\n\n');
    const blob = new Blob([allText], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `Korean-Speaking-${dateStr}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    updateStatus("💾 Chat ဖိုင်ကို ဒေါင်းလုဒ်ဆွဲ သိမ်းဆည်းပြီးပါပြီ!");
  }

  async function startConversation() {
    const gKey = document.getElementById('gemini-key').value.trim();
    const oKey = document.getElementById('openrouter-key').value.trim();
    if (!gKey || !oKey) {
      alert("Gemini API Key နဲ့ OpenRouter API Key နှစ်ခုလုံး ထည့်ပေးပါ။");
      return;
    }
    saveKeys();
    if (isRunning) return;
    isRunning = true;

    if (chatHistory.length === 0) {
      addMessage('user', 'System', 'ကိုရီးယား နေ့စဉ်သုံး စကားပြော (Daily Korean Speaking) အကြောင်း စတင်ဆွေးနွေးပါ။');
    }

    while (isRunning) {
      const recentContext = chatHistory.slice(-6).map(m => `${m.name}: ${m.text}`).join('\n');
      
      if (turn === 'gemini') {
        updateStatus("💬 Gemini စာရိုက်နေပါသည်...");
        const reply = await callGemini(gKey, recentContext);
        if (!isRunning) break;
        if (reply) addMessage('gemini', 'Gemini', reply);
        turn = 'deepseek';
      } else {
        updateStatus("💬 DeepSeek စာရိုက်နေပါသည်...");
        const reply = await callOpenRouter(oKey, recentContext);
        if (!isRunning) break;
        if (reply) addMessage('deepseek', 'DeepSeek (OpenRouter)', reply);
        turn = 'gemini';
      }

      if (!isRunning) break;
      updateStatus("⏳ စာဖတ်ချိန် ၄ စက္ကန့် စောင့်ဆိုင်းနေပါသည်...");
      await new Promise(r => setTimeout(r, 4000));
    }
  }

  async function callGemini(apiKey, context) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `${systemPrompt}\n\nConversation so far:\n${context}\n\nYour turn (Gemini):` }] }]
        })
      });
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "Error from Gemini";
    } catch (e) {
      isRunning = false;
      updateStatus("❌ Gemini ချိတ်ဆက်မှု အဆင်မပြေပါ");
      return "Gemini Error: " + e.message;
    }
  }

  async function callOpenRouter(apiKey, context) {
    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: "deepseek/deepseek-chat",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: `Conversation so far:\n${context}\n\nYour turn (DeepSeek):` }
          ]
        })
      });
      const data = await res.json();
      return data.choices?.[0]?.message?.content || "Error from OpenRouter";
    } catch (e) {
      isRunning = false;
      updateStatus("❌ OpenRouter ချိတ်ဆက်မှု အဆင်မပြေပါ");
      return "OpenRouter Error: " + e.message;
    }
  }
</script>
</body>
</html>
